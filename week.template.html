<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Things: неделя по проектам</title>
<style>
  :root {
    color-scheme: light;
    --surface:#fcfcfb; --card:#ffffff; --border:#e6e5e1; --line:#3a3936;
    --ink:#0b0b0b; --ink-2:#52514e; --ink-3:#83817b;
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --old:#dedcd6; --touch:#bdbbb5;
    --cl1:#1c5cab; --cl2:#6da7ec; --op1:#b8322f; --op2:#f0918e; --grid-b:#eceae6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface:#131312; --card:#1a1a19; --border:#2e2e2c; --line:#9d9c94;
      --ink:#ffffff; --ink-2:#c3c2b7; --ink-3:#8d8c84;
      --s1:#3987e5; --s2:#d95926; --s3:#199e70; --old:#403f3b; --touch:#5c5b56;
      --cl1:#256abf; --cl2:#86b6ef; --op1:#c8403c; --op2:#f0918e; --grid-b:#2a2a28;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface:#131312; --card:#1a1a19; --border:#2e2e2c; --line:#9d9c94;
    --ink:#ffffff; --ink-2:#c3c2b7; --ink-3:#8d8c84;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --old:#403f3b; --touch:#5c5b56;
      --cl1:#256abf; --cl2:#86b6ef; --op1:#c8403c; --op2:#f0918e; --grid-b:#2a2a28;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--surface); color:var(--ink);
    font:14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased; }
  .wrap { max-width:1180px; margin:0 auto; padding:36px 24px 72px; }
  @media (max-width: 620px) {
    .wrap { padding:20px 12px 48px; }
    h1 { font-size:21px; }
    .card { padding:14px 12px 10px; }
    .bar { padding:8px 10px; gap:8px; }
    .week { min-width:150px; font-size:13px; }
    .rowlab { font-size:12px; }
  }
  .top { display:flex; align-items:center; gap:12px; margin-bottom:18px; }
  h1 { font-size:25px; font-weight:640; letter-spacing:-.02em; margin:0; }
  .top button { margin-left:auto; }

  .bar { display:flex; gap:10px; flex-wrap:wrap; align-items:center;
    background:var(--card); border:1px solid var(--border); border-radius:10px;
    padding:10px 12px; margin-bottom:16px; }
  .bar label { font-size:12px; color:var(--ink-2); display:flex; align-items:center; gap:6px; }
  select { font:inherit; font-size:13px; color:var(--ink); background:var(--surface);
    border:1px solid var(--border); border-radius:7px; padding:5px 8px; }
  button { font:inherit; font-size:13px; color:var(--ink); background:var(--surface);
    border:1px solid var(--border); border-radius:7px; padding:5px 11px; cursor:pointer; }
  button:hover:not(:disabled) { border-color:var(--ink-3); }
  button:disabled { opacity:.4; cursor:default; }
  .rstat { font-size:12px; color:var(--ink-3); }
  .week { font-weight:600; font-size:14px; min-width:186px; text-align:center; }


  .bhd { display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; margin-bottom:12px; }
  .bhd h2 { font-size:15px; font-weight:620; margin:0; }
  .bhd label { font-size:12px; color:var(--ink-2); display:flex; align-items:center; gap:6px; }
  /* the weekday chart keeps its full size: 7 columns of 96px plus its axis
     (718px) and the card padding; the wheel takes what is left */
  .pair { display:grid; grid-template-columns:760px minmax(0, 1fr); gap:16px; margin-bottom:16px; }
  .pair > .card { margin-bottom:0; min-width:0; }
  @media (max-width: 1160px) { .pair { grid-template-columns:minmax(0, 1fr); } }
  .card { background:var(--card); border:1px solid var(--border); border-radius:10px;
    padding:18px 20px 14px; margin-bottom:16px; }
  .chart { width:100%; overflow-x:auto; }
  svg { display:block; }
  .rowlab { font-size:13px; font-weight:600; fill:var(--ink-2); cursor:default; }
  .val { font-size:10px; font-variant-numeric:tabular-nums; fill:var(--ink-3); }

  .tip { position:fixed; z-index:20; pointer-events:none; opacity:0;
    background:var(--card); color:var(--ink); border:1px solid var(--border); border-radius:9px;
    box-shadow:0 8px 26px rgba(0,0,0,.18); transition:opacity .07s; }
  .tip { padding:8px 10px; font-size:12px; line-height:1.5;
    font-variant-numeric:tabular-nums; white-space:nowrap; }
  .tip b { display:block; margin-bottom:3px; font-weight:600; }
  .tip .r { display:flex; align-items:center; gap:7px; }
  .tip .r i { width:8px; height:8px; border-radius:2px; }
  .tip .r.strong { font-weight:600; color:var(--ink); }
  .tip .r.sep { margin-top:6px; }
  .tip .r s { text-decoration:none; margin-left:auto; padding-left:16px; }

  .legend { display:flex; flex-wrap:wrap; gap:6px 22px; margin-top:12px; font-size:12px; color:var(--ink-2); }
  .legend span { display:flex; align-items:center; gap:6px; }
  .legend i { width:10px; height:10px; border-radius:2px; }
  .legend b { font-weight:600; color:var(--ink); font-variant-numeric:tabular-nums; }
  .empty { color:var(--ink-3); font-size:13px; padding:20px 2px; }
</style>
</head>
<body>
<div class="wrap">

<div class="top">
  <h1>Неделя по проектам</h1>
  <span class="rstat" id="rstat"></span>
  <button id="refresh" hidden>Обновить данные</button>
</div>

<div class="bar">
  <button id="prev">&larr;</button>
  <span class="week" id="wlabel"></span>
  <button id="next">&rarr;</button>
  <button id="today">Текущая неделя</button>
  <label>Неделя <select id="wsel"></select></label>
</div>

<div class="pair">
<div class="card">
  <div class="bhd"><h2>Распределение закрытий по дням недели</h2></div>
  <div class="chart" id="days"></div>
</div>

<div class="card">
  <div class="bhd"><h2>Баланс по областям</h2></div>
  <div class="chart" id="areas"></div>
</div>
</div>

<div class="card">
  <div class="bhd"><h2>Добавлено и сделано за неделю</h2></div>
  <div class="chart" id="flow"></div>
</div>

<div class="card">
  <div class="bhd"><h2>Проекты недели</h2></div>
  <div class="chart" id="chart"></div>
</div>
</div>
<div class="tip" id="tip"></div>

<script>
const DATA = /*__DATA__*/;
const NS = "http://www.w3.org/2000/svg";
const el = (t, a = {}) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); return e; };
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const MON = ["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
const MONF = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];

const addDays = (iso, n) => { const d = new Date(iso + "T00:00:00"); d.setDate(d.getDate() + n); return d; };
const human = d => d.getDate() + " " + MONF[d.getMonth()] + " " + d.getFullYear();
// a week label spans its Monday to the following Sunday
const wlabel = ws => {
  const a = addDays(ws, 0), b = addDays(ws, 6);
  return a.getDate() + " " + MON[a.getMonth()] + " - " + b.getDate() + " " + MON[b.getMonth()] + " " + b.getFullYear();
};

const CAT = [
  { id: "co", name: "Закрыто, создано раньше",    color: () => css("--cl1"), right: 1 },
  { id: "cn", name: "Закрыто, создано на неделе",  color: () => css("--cl2"), right: 1 },
  { id: "oo", name: "Открыто, создано раньше",    color: () => css("--op1"), right: 0 },
  { id: "on", name: "Открыто, создано на неделе",  color: () => css("--op2"), right: 0 }
];

// project state as of the end of the displayed week, computed by build_week.py
const STATE = {
  wk:    { n: "закрыт на этой неделе", mark: "solid" },
  later: { n: "был в работе, закрыт позже", mark: "hollow" },
  open:  { n: "открыт", mark: null }
};

const tip = document.getElementById("tip");
function showTip(ev, title, rows) {
  tip.innerHTML = "<b>" + title + "</b>" + rows.map(r =>
    '<div class="r' + (r.b ? " strong" : "") + (r.top ? " sep" : "") + '">' +
    (r.c ? '<i style="background:' + r.c + '"></i>' : "") + r.k + "<s>" + r.v + "</s></div>").join("");
  place(tip, ev);
}
function place(node, ev) {
  node.style.opacity = 1;
  const b = node.getBoundingClientRect();
  let x = ev.clientX + 16, y = ev.clientY - b.height - 12;
  if (x + b.width > innerWidth - 8) x = Math.max(8, ev.clientX - b.width - 16);
  if (y < 8) y = ev.clientY + 20;
  y = Math.min(Math.max(8, y), Math.max(8, innerHeight - b.height - 8));
  node.style.left = x + "px"; node.style.top = y + "px";
}
const hideTip = () => tip.style.opacity = 0;

function barR(x, y, w, h, r) {
  r = Math.min(r, h / 2, w);
  return `M${x},${y} L${x+w-r},${y} Q${x+w},${y} ${x+w},${y+r} L${x+w},${y+h-r} Q${x+w},${y+h} ${x+w-r},${y+h} L${x},${y+h} Z`;
}
function barL(x, y, w, h, r) {
  r = Math.min(r, h / 2, w);
  return `M${x+w},${y} L${x+r},${y} Q${x},${y} ${x},${y+r} L${x},${y+h-r} Q${x},${y+h} ${x+r},${y+h} L${x+w},${y+h} Z`;
}
let week = DATA.current;


const BACK = 55;                                  // weeks behind the current one for the corridor

// closures per day from the first week to today, every to-do with a stop date
const CLOSED = DATA.days.closed;

const DAY0 = addDays(DATA.days.s, 0);
const idxOf = iso => Math.round((addDays(iso, 0) - DAY0) / 86400000);

// closures per weekday for the week starting at `startIso`, cut off at today
function weekCloses(startIso) {
  const lo = idxOf(startIso), today = idxOf(DATA.today);
  const days = Math.min(7, today - lo + 1);
  if (days <= 0) return [];
  const out = [];
  for (let i = 0; i < days; i++) out.push(CLOSED[lo + i] || 0);
  return out;
}

const CAP = 20;                                   // last plotted count; everything above lands in CAP+


function poisson(lam, k) {
  let p = Math.exp(-lam);
  for (let i = 1; i <= k; i++) p *= lam / i;
  return p;
}

// Lanczos log-gamma, enough for the negative binomial with a non-integer r
function lgamma(z) {
  const g = [676.5203681218851, -1259.1392167224028, 771.32342877765313,
    -176.61502916214059, 12.507343278686905, -0.13857109526572012,
    9.9843695780195716e-6, 1.5056327351493116e-7];
  if (z < 0.5) return Math.log(Math.PI / Math.sin(Math.PI * z)) - lgamma(1 - z);
  z -= 1;
  let x = 0.99999999999980993;
  for (let i = 0; i < 8; i++) x += g[i] / (z + i + 1);
  const t = z + 7.5;
  return 0.5 * Math.log(2 * Math.PI) + (z + 0.5) * Math.log(t) - t + Math.log(x);
}

// negative binomial fitted by moments: variance = mean + mean^2 / r
function negbin(mean, vari, k) {
  if (vari <= mean) return poisson(mean, k);
  const r = mean * mean / (vari - mean), p = r / (r + mean);
  return Math.exp(lgamma(k + r) - lgamma(r) - lgamma(k + 1) + r * Math.log(p) + k * Math.log(1 - p));
}

// one density strip per weekday: darker means a more likely number of closures,
// the tick is what this week actually did
function drawDays() {
  const node = document.getElementById("days");
  const idx = DATA.weeks.indexOf(week);
  const weeks = [];
  for (let k = 1; k <= BACK; k++) {
    const i = idx - k;
    if (i < 0) continue;
    const v = weekCloses(DATA.weeks[i]);
    if (v.length === 7) weeks.push(v);
  }
  const cur = weekCloses(week);
  if (weeks.length < 5) {
    node.innerHTML = '<div class="empty">Недостаточно завершённых недель.</div>';
    return;
  }

  const names = ["пн","вт","ср","чт","пт","сб","вс"];
  const stats = names.map((_, d) => {
    const v = weeks.map(w => w[d]);
    const m = v.reduce((a, x) => a + x, 0) / v.length;
    const va = v.reduce((a, x) => a + (x - m) ** 2, 0) / (v.length - 1);
    const hist = new Array(CAP + 2).fill(0);
    for (const x of v) hist[Math.min(x, CAP + 1)]++;
    const p = [];
    let acc = 0;
    for (let k = 0; k <= CAP; k++) { const q = negbin(m, va, k); acc += q; p.push(q); }
    p.push(Math.max(0, 1 - acc));
    // most likely single count; the last cell is a tail total, not a value
    const body = p.slice(0, CAP + 1);
    return { m, va, hist, p, pmax: Math.max(...p), mode: body.indexOf(Math.max(...body)) };
  });

  const W = Math.max(300, node.clientWidth || 900);
  const padL = 34, padR = 12, padT = 10, labH = 26;
  const rows = CAP + 2, cellH = 15, ih = rows * cellH;
  const H = padT + ih + labH;
  const colW = Math.max(30, Math.min(96, (W - padL - padR) / 7));
  const sw = Math.max(14, colW - 12);
  const X = d => padL + d * colW;
  const Y = k => padT + ih - (k + 1) * cellH;         // count grows upward

  const svg = el("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}` });
  for (let k = 0; k <= CAP + 1; k++) {
    if (k % 5 && k !== CAP + 1) continue;
    const t = el("text", { class: "val", x: padL - 8, y: Y(k) + cellH / 2 + 4, "text-anchor": "end" });
    t.textContent = k === CAP + 1 ? (CAP + 1) + "+" : k;
    svg.appendChild(t);
  }

  // the weekend is boxed rather than tinted, so the cells keep their own ground
  svg.appendChild(el("rect", {
    x: X(5) + 0.5, y: padT - 4.5, width: colW * 2 - 1, height: ih + 26, rx: 5,
    fill: "none", stroke: css("--border"), "stroke-width": 1
  }));

  stats.forEach((st, d) => {
    const hereK = cur[d] === undefined ? -1 : Math.min(cur[d], CAP + 1);
    for (let k = 0; k <= CAP + 1; k++) {
      const isHere = k === hereK;
      svg.appendChild(el("rect", {
        x: X(d) + 6, y: Y(k), width: sw, height: cellH - 1, rx: 2,
        fill: isHere ? "#faf1e8" : css("--cl1"),
        opacity: isHere ? 1 : 0.05 + 0.95 * (st.p[k] / st.pmax)
      }));
    }
    const t = el("text", { class: "val", x: X(d) + 6 + sw / 2, y: padT + ih + 17, "text-anchor": "middle" });
    t.textContent = names[d]; svg.appendChild(t);

    if (hereK >= 0) {
      const lb = el("text", { x: X(d) + 6 + sw / 2, y: Y(hereK) + cellH / 2 + 3.5, "text-anchor": "middle",
        "font-size": 10, "font-weight": 600, fill: "#3a1210", "pointer-events": "none" });
      lb.textContent = cur[d]; svg.appendChild(lb);
    }

    const hit = el("rect", { x: X(d), y: padT, width: colW, height: ih, fill: "transparent" });
    hit.addEventListener("mousemove", ev => {
      const b = svg.getBoundingClientRect();
      const yy = (ev.clientY - b.top) * (H / b.height);
      const k = Math.max(0, Math.min(CAP + 1, Math.floor((padT + ih - yy) / cellH)));
      showTip(ev, ["понедельник","вторник","среда","четверг","пятница","суббота","воскресенье"][d] +
        ", " + (k > CAP ? (CAP + 1) + " и больше" : k + " закрытий"), [
        { c: css("--cl1"), k: "Вероятность по модели", v: (st.p[k] * 100).toFixed(1) + "%" },
        { k: "Недель было столько", v: st.hist[k] },
        { k: "Мода по модели", v: st.mode },
        { k: "Эта неделя", v: cur[d] === undefined ? "-" : cur[d], b: true }
      ]);
    });
    hit.addEventListener("mouseleave", hideTip);
    svg.appendChild(hit);
  });

  node.innerHTML = ""; node.appendChild(svg);
}

// balance wheel: one spoke per area, distance from the centre is the number of
// tasks closed in the area this week. The outer line is the number of tasks
// touched (created, edited or closed); weeks from before it was collected have
// none. Spokes keep a fixed (alphabetical) order, so the shape of different
// weeks can be compared.
const AREA_TOP = 30;                             // tasks at the outer ring of the wheel
function drawAreas() {
  const node = document.getElementById("areas");
  const spokes = DATA.wk[week].a;                 // [title, closed, touched or null] in a fixed order
  const names = spokes.map(x => x[0]), byArea = spokes.map(x => x[1]);
  const hasTouched = spokes.some(x => x[2] != null);
  const touched = spokes.map(x => x[2] || 0);
  const n = names.length;
  const total = byArea.reduce((a, v) => a + v, 0);
  const totalTouched = touched.reduce((a, v) => a + v, 0);

  if (!total && !totalTouched) {
    node.innerHTML = '<div class="empty">На этой неделе ничего не закрыто.</div>';
    return;
  }

  const W = Math.max(260, node.clientWidth || 900);
  const ang = i => -Math.PI / 2 + i * 2 * Math.PI / n;
  const svg = el("svg", { width: W, height: 100, viewBox: `0 0 ${W} 100` });
  const back = el("g"), front = el("g");
  svg.appendChild(back); svg.appendChild(front);
  node.innerHTML = ""; node.appendChild(svg);

  // labels first: their measured width decides how much room the side spokes
  // need, and so the radius
  const labs = names.map(name => {
    const lab = el("text", { class: "rowlab", "font-size": 12 });
    lab.textContent = name; front.appendChild(lab);
    return { lab };
  });
  // a label sits beside its spoke only when the spoke is near horizontal;
  // otherwise it is centred over (or under) the spoke end, which needs half
  // the width and lets the wheel grow in a narrow card
  const kind = i => {
    const c = Math.cos(ang(i)), s = Math.sin(ang(i));
    return Math.abs(c) < 0.2 ? "vert" : (Math.abs(s) < 0.3 ? "side" : "diag");
  };
  const gap = 10, lineH = 14;
  let R = 170;
  labs.forEach((l, i) => {
    const c = Math.abs(Math.cos(ang(i))), w = l.lab.getBBox().width, k = kind(i);
    if (k === "vert") return;
    const need = k === "side" ? w : w / 2;
    R = Math.min(R, (W / 2 - 4 - need) / c - gap);
  });
  R = Math.max(40, R);
  const H = 2 * (R + gap + lineH + 6), cx = W / 2, cy = H / 2;
  svg.setAttribute("height", H); svg.setAttribute("viewBox", `0 0 ${W} ${H}`);

  // the scale is the same for every week, so the wheels of different weeks can
  // be compared; a value above the top simply runs out of the outer ring
  const ticks = [10, 20, AREA_TOP], top = AREA_TOP;
  const pt = (i, v) => [cx + Math.cos(ang(i)) * R * v / top, cy + Math.sin(ang(i)) * R * v / top];

  // rings at the tick values, drawn as polygons to match the spokes
  ticks.forEach(t => {
    if (!t) return;
    back.appendChild(el("polygon", {
      points: names.map((_, i) => pt(i, t).join(",")).join(" "),
      fill: "none", stroke: css("--grid-b"), "stroke-width": 1
    }));
    const [, y] = pt(0, t);
    // scale values stay faint, so they do not read as counts of the top spoke
    const lb = el("text", { class: "val", x: cx + 4, y: y + 11, "font-size": 9, "fill-opacity": 0.55 });
    lb.textContent = t; back.appendChild(lb);
  });
  names.forEach((_, i) => {
    const [x, y] = pt(i, top);
    back.appendChild(el("line", { x1: cx, y1: cy, x2: x, y2: y, stroke: css("--grid-b"), "stroke-width": 1 }));
  });

  if (hasTouched) {
    const outer = names.map((_, i) => pt(i, touched[i]));
    back.appendChild(el("polygon", {
      points: outer.map(p => p.join(",")).join(" "),
      fill: "none", stroke: css("--touch"), "stroke-width": 2, "stroke-linejoin": "round"
    }));
  }

  const shape = names.map((_, i) => pt(i, byArea[i]));
  back.appendChild(el("polygon", {
    points: shape.map(p => p.join(",")).join(" "),
    fill: css("--cl1"), "fill-opacity": 0.16, stroke: css("--cl1"), "stroke-width": 2, "stroke-linejoin": "round"
  }));

  names.forEach((name, i) => {
    const [x, y] = shape[i];
    // small marks, and none at zero: on a quiet week they would pile up in the centre
    if (byArea[i]) back.appendChild(
      el("circle", { cx: x, cy: y, r: 2.5, fill: css("--cl1"), stroke: css("--card"), "stroke-width": 1 }));

    // label just outside the outer ring, anchored away from the centre
    const c = Math.cos(ang(i)), s = Math.sin(ang(i));
    const lx = cx + c * (R + gap), ly = cy + s * (R + gap);
    const k = kind(i);
    const anchor = k === "side" ? (c > 0 ? "start" : "end") : "middle";
    // diagonal labels step further off the corner, clear of the outer ring
    const y1 = k === "side" ? ly + 4
      : (s < 0 ? ly - (k === "diag" ? 12 : 4) : ly + (k === "diag" ? 18 : 12));
    const { lab } = labs[i];
    lab.setAttribute("text-anchor", anchor);
    lab.setAttribute("x", lx); lab.setAttribute("y", y1);

    const tipRows = [
      { c: css("--cl1"), k: "Закрыто за неделю", v: byArea[i], b: true },
      { k: "Доля от всех закрытых", v: (total ? Math.round(byArea[i] / total * 100) : 0) + "%" }
    ];
    if (hasTouched) tipRows.push({ c: css("--touch"), k: "Затронуто за неделю", v: touched[i], top: true });
    const hit = el("circle", { cx: x, cy: y, r: 14, fill: "transparent" });
    front.appendChild(hit);
    for (const target of [lab, hit]) {
      target.addEventListener("mousemove", ev => showTip(ev, name, tipRows));
      target.addEventListener("mouseleave", hideTip);
    }
  });

  if (hasTouched) {
    const leg = document.createElement("div");
    leg.className = "legend";
    for (const [color, name, v] of [[css("--cl1"), "Закрыто", total], [css("--touch"), "Затронуто", totalTouched]]) {
      const item = document.createElement("span");
      item.innerHTML = `<i style="background:${color}"></i>${name}: <b>${v}</b>`;
      leg.appendChild(item);
    }
    node.appendChild(leg);
  }
}


// one stacked bar for the shown week: what was added and is still open, what
// was added and already done, and what was done from earlier weeks
function drawFlow() {
  const node = document.getElementById("flow");
  const [newOpen, newDone, oldDone] = DATA.wk[week].f;
  const segs = [
    { n: newOpen, color: css("--op2"), name: "Новые не закрытые задачи" },
    { n: newDone, color: css("--cl2"), name: "Новые закрытые задачи" },
    { n: oldDone, color: css("--cl1"), name: "Старые закрытые задачи" }
  ];
  const sum = newOpen + newDone + oldDone;
  if (!sum) {
    node.innerHTML = '<div class="empty">На этой неделе ничего не добавлено и не сделано.</div>';
    return;
  }

  const W = Math.max(260, node.clientWidth || 900);
  const barH = 22;
  const svg = el("svg", { width: W, height: barH, viewBox: `0 0 ${W} ${barH}` });
  node.innerHTML = ""; node.appendChild(svg);

  // segments share the width by count; a 2px gap of card colour between them
  const shown = segs.filter(g => g.n);
  const unit = (W - 2 * (shown.length - 1)) / sum;
  let x = 0;
  shown.forEach((g, k) => {
    const w = g.n * unit;
    const first = k === 0, last = k === shown.length - 1, r = 4;
    const d = first && last ? barL(x, 0, w / 2, barH, r) + barR(x + w / 2, 0, w / 2, barH, r)
      : first ? barL(x, 0, w, barH, r) : last ? barR(x, 0, w, barH, r)
      : `M${x},0 h${w} v${barH} h${-w} Z`;
    svg.appendChild(el("path", { d, fill: g.color }));
    const hit = el("rect", { x, y: 0, width: w, height: barH, fill: "transparent" });
    hit.addEventListener("mousemove", ev => showTip(ev, g.name, [
      { c: g.color, k: "Задач", v: g.n, b: true },
      { k: "Доля", v: Math.round(g.n / sum * 100) + "%" }
    ]));
    hit.addEventListener("mouseleave", hideTip);
    svg.appendChild(hit);
    x += w + 2;
  });

  // legend with the counts, in the same order as the bar; wraps on narrow screens
  const leg = document.createElement("div");
  leg.className = "legend";
  for (const g of segs) {
    const it = document.createElement("span");
    const sw = document.createElement("i");
    sw.style.background = g.color;
    it.appendChild(sw);
    it.appendChild(document.createTextNode(g.name + ": "));
    const b = document.createElement("b"); b.textContent = g.n; it.appendChild(b);
    leg.appendChild(it);
  }
  node.appendChild(leg);
}

function draw() {
  // [title, state, closed date, co, cn, oo, on]; Someday and canceled projects
  // are already left out by build_week.py
  const ps = DATA.wk[week].p.map(([t, st, ed, co, cn, oo, on]) => ({ p: { t, st, ed }, c: { co, cn, oo, on } }));
  // most open tasks first, ties by name
  ps.sort((a, b) => (b.c.oo + b.c.on) - (a.c.oo + a.c.on) || a.p.t.localeCompare(b.p.t));

  document.getElementById("wlabel").textContent = wlabel(week);
  document.getElementById("wsel").value = week;
  document.getElementById("next").disabled = week >= DATA.current;
  document.getElementById("today").disabled = week === DATA.current;
  document.getElementById("prev").disabled = week <= DATA.weeks[0];

  const node = document.getElementById("chart");
  if (!ps.length) {
    node.innerHTML = '<div class="empty">На этой неделе активных проектов не было.</div>';
    drawAreas();
    drawFlow();
    drawDays();
    return;
  }

  const maxR = Math.max(1, ...ps.map(x => x.c.co + x.c.cn));
  const maxL = Math.max(1, ...ps.map(x => x.c.oo + x.c.on));
  const avail0 = node.clientWidth || 900;
  const narrow = avail0 < 620;
  const labW = narrow ? 112 : 196, padR = narrow ? 26 : 44;
  const avail = Math.max(160, avail0 - labW - padR);
  const unit = Math.max(3, Math.min(22, avail / (maxR + maxL)));
  const rowH = 26, barH = 15;
  const zeroX = labW + maxL * unit;
  const W = Math.max(300, labW + (maxL + maxR) * unit + padR);
  const H = ps.length * rowH + 10;

  const svg = el("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}` });
  svg.appendChild(el("line", { x1: zeroX + .5, y1: 2, x2: zeroX + .5, y2: H - 8,
    stroke: css("--line"), "stroke-width": 1 }));

  ps.forEach((x, i) => {
    const y = 4 + i * rowH, yb = y + (rowH - barH) / 2;
    let xr = zeroX + 1;
    for (const cat of CAT.filter(c => c.right)) {
      const n = x.c[cat.id]; if (!n) continue;
      svg.appendChild(el("path", { d: barR(xr, yb, n * unit - 1, barH, 3), fill: cat.color() }));
      xr += n * unit;
    }
    let xl = zeroX;
    for (const cat of CAT.filter(c => !c.right)) {
      const n = x.c[cat.id]; if (!n) continue;
      xl -= n * unit;
      svg.appendChild(el("path", { d: barL(xl + 1, yb, n * unit - 1, barH, 3), fill: cat.color() }));
    }
    if (x.c.co + x.c.cn) {
      const t = el("text", { class: "val", x: xr + 5, y: yb + barH - 3 });
      t.textContent = x.c.co + x.c.cn; svg.appendChild(t);
    }
    if (x.c.oo + x.c.on) {
      const t = el("text", { class: "val", x: xl - 5, y: yb + barH - 3, "text-anchor": "end" });
      t.textContent = x.c.oo + x.c.on; svg.appendChild(t);
    }

    const st = x.p.st;
    if (STATE[st].mark) {
      svg.appendChild(el("rect", {
        x: labW - 20, y: yb + 4, width: 8, height: 8, rx: 2,
        fill: STATE[st].mark === "solid" ? css("--cl1") : "none",
        stroke: STATE[st].mark === "solid" ? "none" : css("--ink-3"),
        "stroke-width": 1.4
      }));
    }
    const lab = el("text", { class: "rowlab", x: 4, y: yb + barH - 3 });
    const room = narrow ? 15 : 26;
    lab.textContent = x.p.t.length > room ? x.p.t.slice(0, room - 1) + "…" : x.p.t;
    svg.appendChild(lab);

    const hit = el("rect", { x: labW, y: y, width: W - labW, height: rowH, fill: "transparent" });
    hit.addEventListener("mousemove", ev => showTip(ev, x.p.t,
      CAT.map(c => ({ c: c.color(), k: c.name, v: x.c[c.id] }))
        .concat([{ k: "Проект", v: STATE[st].n + (x.p.ed ? ", " + human(addDays(x.p.ed, 0)) : "") }])));
    hit.addEventListener("mouseleave", hideTip);
    svg.appendChild(hit);
  });

  node.innerHTML = ""; node.appendChild(svg);
  drawAreas();
  drawFlow();
  drawDays();
}

const wsel = document.getElementById("wsel");
wsel.innerHTML = DATA.weeks.slice().reverse().map(w => `<option value="${w}">${wlabel(w)}</option>`).join("");
document.getElementById("prev").onclick = () => {
  const i = DATA.weeks.indexOf(week); if (i > 0) { week = DATA.weeks[i - 1]; draw(); }
};
document.getElementById("next").onclick = () => {
  const i = DATA.weeks.indexOf(week); if (i < DATA.weeks.length - 1) { week = DATA.weeks[i + 1]; draw(); }
};
wsel.onchange = () => { week = wsel.value; draw(); };
document.getElementById("today").onclick = () => { week = DATA.current; draw(); };
addEventListener("resize", () => { clearTimeout(window._rt); window._rt = setTimeout(draw, 150); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);

draw();

// The button exists only when the page is served by serve.py: a file:// page
// has no way to run anything on the machine.
const rbtn = document.getElementById("refresh"), rstat = document.getElementById("rstat");
if (location.protocol === "http:" || location.protocol === "https:") {
  rbtn.hidden = false;
  rbtn.onclick = async () => {
    rbtn.disabled = true;
    rbtn.textContent = "Обновляю...";
    rstat.textContent = "";
    try {
      const res = await fetch("/refresh", { method: "POST" });
      const j = await res.json();
      if (j.ok) { location.reload(); return; }
      rstat.textContent = (j.out || "").split("\n").filter(Boolean).pop() || "не удалось";
    } catch (e) {
      rstat.textContent = String(e);
    }
    rbtn.textContent = "Обновить данные";
    rbtn.disabled = false;
  };
}
</script>
